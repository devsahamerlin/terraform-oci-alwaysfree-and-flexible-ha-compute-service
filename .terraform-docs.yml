# terraform-docs configuration: injects the Reference tables between the BEGIN/END_TF_DOCS markers
# Run from the repository root:
#   terraform-docs -c .terraform-docs.yml .
#   for d in modules/* examples/*; do terraform-docs -c .terraform-docs.yml "$d"; done
formatter: "markdown table"

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: false
  html: true
  indent: 3
  lockfile: false
  required: true
  sensitive: true
  type: true
