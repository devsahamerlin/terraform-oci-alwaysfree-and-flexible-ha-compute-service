name: Terraform CI/CD

env:
  EXAMPLE_DIR: examples/example-1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.go"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  terraform-validate-and-security-scan:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read           # Read repository contents
      pull-requests: write     # Write PR comments
      security-events: write   # Upload security scan results (SARIF)
      actions: read            # Read workflow run information (required for SARIF)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # Validate root module
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (root)
        run: terraform init -backend=false

      - name: Terraform Validate (root)
        run: terraform validate

      # Validate example
      - name: Terraform Init (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

      # ── Pre-commit (terraform-docs is checked locally, the binary is not installed in CI)
      - name: Run pre-commit
        id: precommit
        continue-on-error: true
        env:
          SKIP: terraform_docs
        run: |
          pip install pre-commit --quiet
          pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Checkov Security Scan
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
          config_file: .checkov.yaml

      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: |
          tflint --init --config .tflint.hcl 2>&1 || true
          tflint --recursive --format compact 2>&1 | tee /tmp/tflint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Upload security scan results to GitHub Code Scanning
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov-terraform
        continue-on-error: true  # Don't fail the workflow if the upload fails

      # PRs from forks get a read-only token: only comment on PRs from this repository
      - name: Comment Checkov Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Checkov Security Scan
            \`\`\`
            ${{ steps.checkov.outputs.results }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Deploys real (Always Free) resources: runs on main and on demand only, never on fork PRs (no secrets there)
  terratest-smoke:
    needs: terraform-validate-and-security-scan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: terratest-oci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Terraform by default; set the repository variable TF_BINARY=tofu to run the same tests with OpenTofu
      - name: Resolve IaC binary
        id: iac
        run: |
          FORCED="${{ vars.TF_BINARY }}"   # repository variable (not a secret): "terraform" (default) or "tofu"

          if [ "$FORCED" = "tofu" ]; then
            echo "binary=tofu"    >> $GITHUB_OUTPUT
            echo "tool=opentofu"  >> $GITHUB_OUTPUT
          else
            echo "binary=terraform" >> $GITHUB_OUTPUT
            echo "tool=terraform"   >> $GITHUB_OUTPUT
          fi

          echo "Resolved IaC tool: $(cat $GITHUB_OUTPUT | grep binary)"

      - name: Install Terraform
        if: steps.iac.outputs.binary == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Install OpenTofu (optional)
        if: steps.iac.outputs.binary == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"

      - name: Verify binary
        run: |
          echo "Using: ${{ steps.iac.outputs.tool }}"
          ${{ steps.iac.outputs.binary }} version

      - name: Write OCI private key
        env:
          OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
        run: |
          KEY="$GITHUB_WORKSPACE/.keys/oci_api_key.pem"
          mkdir -p "$GITHUB_WORKSPACE/.keys"
          printf '%s' "$OCI_PRIVATE_KEY_B64" | base64 --decode > "$KEY" \
            || { echo "::error::OCI_PRIVATE_KEY_B64 is not valid base64"; exit 1; }
          chmod 600 "$KEY"

          # The OCI provider hides the real cause behind "did not find a proper configuration for private key": fail here with a clear message
          if ! openssl pkey -in "$KEY" -noout -passin pass: 2>/dev/null; then
            HEADER=$(grep -m1 -o '^-----BEGIN [A-Z ]*-----' "$KEY" || echo "no PEM header (double base64-encoded, or not the .pem file?)")
            echo "::error::OCI_PRIVATE_KEY_B64 does not decode to an unencrypted private key. Found: $HEADER ($(wc -c < "$KEY") bytes)"
            exit 1
          fi

      - name: Write SSH public key
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY_B64 }}" | base64 --decode > ${{ github.workspace }}/.keys/id_rsa_ci.pub
          chmod 644 ${{ github.workspace }}/.keys/id_rsa_ci.pub

      # ── Setup Go ────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Run Terratest ────────────────────────────────────────────────────────
      - name: Run Smoke Test (${{ steps.iac.outputs.tool }})
        working-directory: test/
        run: |
          go mod tidy
          go test -v -run TestSmokeNetworkAndCompute -timeout 20m
        env:
          TF_BINARY: ${{ steps.iac.outputs.binary }}
          # Scalar auth values, stored directly as secrets
          TF_VAR_tenancy_ocid:  ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_user_ocid:     ${{ secrets.TF_VAR_USER_OCID }}
          TF_VAR_fingerprint:   ${{ secrets.TF_VAR_FINGERPRINT }}
          TF_VAR_region:        ${{ secrets.TF_VAR_REGION }}
          TF_VAR_namespace:     ${{ secrets.TF_VAR_NAMESPACE }}

          TF_VAR_atp_admin_password: ${{ secrets.TF_VAR_atp_admin_password }}
          TF_VAR_backend_domain_name: ${{ secrets.TF_VAR_backend_domain_name }}
          TF_VAR_frontend_domain_name: ${{ secrets.TF_VAR_frontend_domain_name }}

          # Paths, built from the files written above
          TF_VAR_private_key_path:    ${{ github.workspace }}/.keys/oci_api_key.pem
          TF_VAR_ssh_public_key_path: ${{ github.workspace }}/.keys/id_rsa_ci.pub

      # ── Mandatory cleanup ────────────────────────────────────────────────────
      - name: Cleanup key files
        if: always()   # runs even when the test fails
        run: rm -rf ${{ github.workspace }}/.keys
