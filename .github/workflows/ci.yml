name: Terraform CI/CD

env:
  EXAMPLE_DIR: examples/example-1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - "**.go"
      - "tests/**"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"
  workflow_dispatch:

# Third-party actions are pinned to a commit SHA (a tag can be moved to malicious code); the comment gives the version
jobs:
  terraform-validate-and-security-scan:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read           # Read repository contents
      pull-requests: write     # Write PR comments
      security-events: write   # Upload security scan results (SARIF)
      actions: read            # Read workflow run information (required for SARIF)

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # terraform test with mock providers needs Terraform >= 1.7 (the module itself still supports >= 1.5)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.6"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      # Validate root module
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (root)
        run: terraform init -backend=false

      - name: Terraform Validate (root)
        run: terraform validate

      # Guardrails, enable_* flags and outputs against a mocked OCI provider (tests/): no credentials, so it also runs on fork PRs
      - name: Terraform Test (root, mocked OCI provider)
        run: terraform test

      # Validate example
      - name: Terraform Init (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

      # ── Pre-commit (terraform-docs is checked locally, the binary is not installed in CI)
      - name: Run pre-commit
        id: precommit
        continue-on-error: true
        env:
          SKIP: terraform_docs
        run: |
          pip install pre-commit --quiet
          pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Checkov Security Scan
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
          config_file: .checkov.yaml

      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: |
          tflint --init --config .tflint.hcl 2>&1 || true
          tflint --recursive --format compact 2>&1 | tee /tmp/tflint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Upload security scan results to GitHub Code Scanning
      - name: Upload SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: checkov-terraform
        continue-on-error: true  # Don't fail the workflow if the upload fails

      # PRs from forks get a read-only token: only comment on PRs from this repository
      - name: Comment Checkov Results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          # Passed through env, not ${{ }} in the script: scan output must never be evaluated as JavaScript
          CHECKOV_RESULTS: ${{ steps.checkov.outputs.results }}
        with:
          script: |
            const output = [
              '#### Checkov Security Scan',
              '```',
              process.env.CHECKOV_RESULTS,
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # Deploys real (Always Free) resources: on main and on demand only. Pull requests get the mocked terraform test
  # of the validation job instead (never switch to pull_request_target to give them secrets)
  terratest-smoke:
    needs: terraform-validate-and-security-scan
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # OCI secrets are environment secrets: the run waits for a required reviewer before any secret is exposed
    environment: terratest
    permissions:
      contents: read
    concurrency:
      group: terratest-oci
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # keep the GITHUB_TOKEN out of .git/config, out of reach of the test code

      # Terraform by default; set the repository variable TF_BINARY=tofu to run the same tests with OpenTofu
      - name: Resolve IaC binary
        id: iac
        env:
          FORCED: ${{ vars.TF_BINARY }}   # repository variable (not a secret): "terraform" (default) or "tofu"
        run: |
          if [ "$FORCED" = "tofu" ]; then
            echo "binary=tofu"    >> $GITHUB_OUTPUT
            echo "tool=opentofu"  >> $GITHUB_OUTPUT
          else
            echo "binary=terraform" >> $GITHUB_OUTPUT
            echo "tool=terraform"   >> $GITHUB_OUTPUT
          fi

          echo "Resolved IaC tool: $(cat $GITHUB_OUTPUT | grep binary)"

      - name: Install Terraform
        if: steps.iac.outputs.binary == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Install OpenTofu (optional)
        if: steps.iac.outputs.binary == 'tofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: "1.11.2"

      - name: Verify binary
        run: |
          echo "Using: ${{ steps.iac.outputs.tool }}"
          ${{ steps.iac.outputs.binary }} version

      # ── Setup Go ────────────────────────────────────────────────────────────
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'

      # Dependencies are fetched (and checked against go.sum) before any key is written to disk
      - name: Download Go modules
        working-directory: test/
        run: go mod download

      # ── Keys: written as late as possible, right before the only step that needs them
      - name: Write OCI private key
        env:
          OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
        run: |
          KEY="$GITHUB_WORKSPACE/.keys/oci_api_key.pem"
          mkdir -p "$GITHUB_WORKSPACE/.keys"
          printf '%s' "$OCI_PRIVATE_KEY_B64" | base64 --decode > "$KEY" \
            || { echo "::error::OCI_PRIVATE_KEY_B64 is not valid base64"; exit 1; }
          chmod 600 "$KEY"

          # GitHub only masks the base64 secret, not the decoded key: mask every line of its body
          tr -d '\r' < "$KEY" | grep -v '^-----' | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::add-mask::$line"; fi
          done

          # The OCI provider hides the real cause behind "did not find a proper configuration for private key": fail here with a clear message
          if ! openssl pkey -in "$KEY" -noout -passin pass: 2>/dev/null; then
            HEADER=$(grep -m1 -o '^-----BEGIN [A-Z ]*-----' "$KEY" || echo "no PEM header (double base64-encoded, or not the .pem file?)")
            echo "::error::OCI_PRIVATE_KEY_B64 does not decode to an unencrypted private key. Found: $HEADER ($(wc -c < "$KEY") bytes)"
            exit 1
          fi

      - name: Write SSH public key
        env:
          SSH_PUBLIC_KEY_B64: ${{ secrets.SSH_PUBLIC_KEY_B64 }}
        run: |
          printf '%s' "$SSH_PUBLIC_KEY_B64" | base64 --decode > "$GITHUB_WORKSPACE/.keys/id_rsa_ci.pub"
          chmod 644 "$GITHUB_WORKSPACE/.keys/id_rsa_ci.pub"

      # ── Run Terratest ────────────────────────────────────────────────────────
      - name: Run Smoke Test (${{ steps.iac.outputs.tool }})
        working-directory: test/
        run: go test -mod=readonly -v -run TestSmokeNetworkAndCompute -timeout 20m
        env:
          TF_BINARY: ${{ steps.iac.outputs.binary }}
          # Scalar auth values, stored directly as secrets
          TF_VAR_tenancy_ocid:  ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_user_ocid:     ${{ secrets.TF_VAR_USER_OCID }}
          TF_VAR_fingerprint:   ${{ secrets.TF_VAR_FINGERPRINT }}
          TF_VAR_region:        ${{ secrets.TF_VAR_REGION }}
          TF_VAR_namespace:     ${{ secrets.TF_VAR_NAMESPACE }}

          # Required by TestStagingFullStack (requireEnv)
          TF_VAR_atp_admin_password: ${{ secrets.TF_VAR_atp_admin_password }}
          TF_VAR_backend_domain_name: ${{ secrets.TF_VAR_backend_domain_name }}
          TF_VAR_frontend_domain_name: ${{ secrets.TF_VAR_frontend_domain_name }}

          # Paths, built from the files written above
          TF_VAR_private_key_path:    ${{ github.workspace }}/.keys/oci_api_key.pem
          TF_VAR_ssh_public_key_path: ${{ github.workspace }}/.keys/id_rsa_ci.pub

      # ── Mandatory cleanup ────────────────────────────────────────────────────
      - name: Cleanup key files
        if: always()   # runs even when the test fails
        run: rm -rf "$GITHUB_WORKSPACE/.keys"
