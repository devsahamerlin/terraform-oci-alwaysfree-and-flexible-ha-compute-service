name: Terraform CI/CD

env:
  EXAMPLE_DIR: examples/example-1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    # Complete permissions for SARIF upload and security scanning
    permissions:
      contents: read           # Read repository contents
      pull-requests: write     # Write PR comments
      security-events: write   # Upload security scan results (SARIF)
      actions: read            # Read workflow run information (required for SARIF)
      id-token: write          # OIDC token for authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      # Validate root module
      - name: Terraform Format Check (root)
        run: terraform fmt -recursive

      - name: Terraform Init (root)
        run: terraform init -backend=false

      - name: Terraform Validate (root)
        run: terraform validate

      # Validate example
      - name: Terraform Init (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

      # Checkov Security Scan
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true  # Always generate SARIF, even if checks fail
          config_file: .checkov.yaml

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

#      # Upload security scan results to GitHub Code Scanning (to uncomment when repository will be public)
#      - name: Upload SARIF file
#        # Only upload if Checkov ran (success or failure)
#        if: success() || failure()
#        uses: github/codeql-action/upload-sarif@v4
#        with:
#          sarif_file: results.sarif
#          category: checkov-terraform
#        continue-on-error: true  # Don't fail workflow if upload fails


      - name: Comment Checkov Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Checkov Security Scan
            \`\`\`
            ${{ steps.checkov.outputs.results }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });