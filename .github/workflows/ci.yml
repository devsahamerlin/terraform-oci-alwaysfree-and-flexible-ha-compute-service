name: Terraform CI/CD

env:
  EXAMPLE_DIR: examples/example-1
  TF_BINARY: tofu # or terraform

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "**.tf"
      - "**.tfvars"

jobs:
  terraform-validate-and-security-scan:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read           # Read repository contents
      pull-requests: write     # Write PR comments
      security-events: write   # Upload security scan results (SARIF)
      actions: read            # Read workflow run information (required for SARIF)
      id-token: write          # OIDC token for authentication

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # TFLint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      # Validate root module
      - name: Terraform Format Check (root)
        run: terraform fmt -recursive

      - name: Terraform Init (root)
        run: terraform init -backend=false

      - name: Terraform Validate (root)
        run: terraform validate

      # Validate example
      - name: Terraform Init (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate (example)
        working-directory: ${{ env.EXAMPLE_DIR }}
        run: terraform validate

      # ── Pre-commit
      - name: Run pre-commit
        id: precommit
        continue-on-error: true
        run: |
          pip install pre-commit --quiet
          pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      # Checkov Security Scan
      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: false
          config_file: .checkov.yaml

      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: |
          tflint --init --config .tflint.hcl 2>&1 || true
          tflint --recursive --format compact 2>&1 | tee /tmp/tflint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      #      # Upload security scan results to GitHub Code Scanning (to uncomment when repository will be public)
      #      - name: Upload SARIF file
      #        # Only upload if Checkov ran (success or failure)
      #        if: success()
      #        uses: github/codeql-action/upload-sarif@v4
      #        with:
      #          sarif_file: results.sarif
      #          category: checkov-terraform
      #        continue-on-error: true  # Don't fail workflow if upload fails


      - name: Comment Checkov Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Checkov Security Scan
            \`\`\`
            ${{ steps.checkov.outputs.results }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  terratest-smoke:
    needs: terraform-validate-and-security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve IaC binary
        id: iac
        run: |
          FORCED="${{ vars.TF_BINARY }}"   # variable de repo (pas secret), ex: "terraform"

          if [ "$FORCED" = "terraform" ]; then
            echo "binary=terraform" >> $GITHUB_OUTPUT
            echo "tool=terraform"   >> $GITHUB_OUTPUT
          else
            echo "binary=tofu"    >> $GITHUB_OUTPUT
            echo "tool=opentofu"  >> $GITHUB_OUTPUT
          fi

          echo "Resolved IaC tool: $(cat $GITHUB_OUTPUT | grep binary)"

      - name: Install OpenTofu
        if: steps.iac.outputs.binary == 'tofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.2"

      - name: Install Terraform
        if: steps.iac.outputs.binary == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Verify binary
        run: |
          echo "Using: ${{ steps.iac.outputs.tool }}"
          ${{ steps.iac.outputs.binary }} version


      - name: Write OCI private key
        run: |
          mkdir -p ${{ github.workspace }}/.keys
          echo "${{ secrets.OCI_PRIVATE_KEY_B64 }}" | base64 --decode > ${{ github.workspace }}/.keys/oci_api_key.pem
          chmod 600 ${{ github.workspace }}/.keys/oci_api_key.pem

      - name: Write SSH public key
        run: |
          echo "${{ secrets.SSH_PUBLIC_KEY_B64 }}" | base64 --decode > ${{ github.workspace }}/.keys/id_rsa_ci.pub
          chmod 644 ${{ github.workspace }}/.keys/id_rsa_ci.pub

      # ── Setup Go ────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Run Terratest ────────────────────────────────────────────────────────
      - name: Run Smoke Test (${{ steps.iac.outputs.tool }})
        working-directory: test/
        run: |
          go mod tidy
          go test -v -run TestSmokeNetworkAndCompute -timeout 20m
        env:
          TF_BINARY: ${{ steps.iac.outputs.binary }}
          # Auth scalaires — stockés directs en secret
          TF_VAR_tenancy_ocid:  ${{ secrets.TF_VAR_TENANCY_OCID }}
          TF_VAR_user_ocid:     ${{ secrets.TF_VAR_USER_OCID }}
          TF_VAR_fingerprint:   ${{ secrets.TF_VAR_FINGERPRINT }}
          TF_VAR_region:        ${{ secrets.TF_VAR_REGION }}
          TF_VAR_namespace:     ${{ secrets.TF_VAR_NAMESPACE }}

          TF_VAR_atp_admin_password: ${{ secrets.TF_VAR_atp_admin_password }}
          TF_VAR_backend_domain_name: ${{ secrets.TF_VAR_backend_domain_name }}
          TF_VAR_frontend_domain_name: ${{ secrets.TF_VAR_frontend_domain_name }}

          # Chemins — construits dynamiquement à partir des fichiers écrits ci-dessus
          TF_VAR_private_key_path:    ${{ github.workspace }}/.keys/oci_api_key.pem
          TF_VAR_ssh_public_key_path: ${{ github.workspace }}/.keys/id_rsa_ci.pub

      # ── Cleanup obligatoire ──────────────────────────────────────────────────
      - name: Cleanup key files
        if: always()   # s'exécute même si le test échoue
        run: |
          rm -f ~/.oci/oci_api_key.pem
          rm -f ~/.ssh/id_rsa_ci.pub