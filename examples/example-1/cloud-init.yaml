#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - jq

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>OCI HA Stack Demo</title>
          <style>
              body { font-family: sans-serif; text-align: center; padding: 50px; }
              .container { background-color: #f0f0f0; padding: 20px; border-radius: 10px; display: inline-block; }
              h1 { color: #d73a49; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>OCI High Availability Stack</h1>
              <p>This request was served by:</p>
              <h2>Instance: <span id="hostname">Loading...</span></h2>
              <h3>Private IP: <span id="ip">Loading...</span></h3>
          </div>
          <script>
              document.getElementById("hostname").innerText = window.location.hostname;
          </script>
      </body>
      </html>

runcmd:
  # Install Nginx if not installed (redundant with packages but safe)
  - apt-get update
  - apt-get install -y nginx jq

  # Get Instance Metadata
  - export INSTANCE_NAME=$(curl -s -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/instance/displayName)
  - export PRIVATE_IP=$(curl -s -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/vnics/ | jq -r '.[0].privateIp')

  # Update index.html with actual metadata
  - sed -i "s/Loading.../$INSTANCE_NAME/g" /var/www/html/index.html
  - sed -i "s/Loading.../$PRIVATE_IP/g" /var/www/html/index.html

  # Configure Nginx to listen on port 80 and 8080 (for frontend LB) and 8000 (for backend LB test)
  - echo "server { listen 80; server_name _; root /var/www/html; index index.html; }" > /etc/nginx/conf.d/default.conf
  - echo "server { listen 8080; server_name _; root /var/www/html; index index.html; }" >> /etc/nginx/conf.d/default.conf
  - echo "server { listen 8000; server_name _; root /var/www/html; index index.html; }" >> /etc/nginx/conf.d/default.conf

  # Open firewall ports (Ubuntu uses ufw or iptables, but Oracle Linux uses firewalld. Ubuntu images on OCI often use iptables-persistent or just iptables)
  # For Ubuntu, we usually use iptables directly or ufw.
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 8080 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 8000 -j ACCEPT
  - netfilter-persistent save || echo "netfilter-persistent not installed"

  # Enable and start Nginx
  - systemctl enable --now nginx
  - systemctl restart nginx
