#cloud-config
package_update: true
package_upgrade: true

packages:
  - nginx
  - curl
  - jq
  - iptables-persistent

write_files:
  - path: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html>
      <head>
          <title>OCI HA Stack Demo</title>
          <style>
              body { font-family: sans-serif; text-align: center; padding: 50px; }
              .container { background-color: #f0f0f0; padding: 20px; border-radius: 10px; display: inline-block; }
              h1 { color: #d73a49; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>OCI High Availability Stack</h1>
              <p>This request was served by:</p>
              <h2>Instance: <span id="hostname">__INSTANCE_NAME__</span></h2>
              <h3>Private IP: <span id="ip">__PRIVATE_IP__</span></h3>
          </div>
      </body>
      </html>
  - path: /etc/nginx/conf.d/custom.conf
    content: |
      server {
          listen 80;
          server_name _;
          root /var/www/html;
          index index.html;
      }
      server {
          listen 8080;
          server_name _;
          root /var/www/html;
          index index.html;
      }
      server {
          listen 8000;
          server_name _;
          root /var/www/html;
          index index.html;
      }

runcmd:
  # Remove default nginx site to avoid conflicts
  - rm -f /etc/nginx/sites-enabled/default

  # Get Instance Metadata and Update index.html
  # We combine these into a single block to ensure variables persist
  - |
    INSTANCE_NAME=$(curl -s -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/instance/displayName)
    PRIVATE_IP=$(curl -s -H "Authorization: Bearer Oracle" -L http://169.254.169.254/opc/v2/vnics/ | jq -r '.[0].privateIp')
    sed -i "s/__INSTANCE_NAME__/$INSTANCE_NAME/g" /var/www/html/index.html
    sed -i "s/__PRIVATE_IP__/$PRIVATE_IP/g" /var/www/html/index.html

  # Open firewall ports
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 8080 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 8000 -j ACCEPT
  - netfilter-persistent save || echo "netfilter-persistent not installed"

  # Enable and start Nginx
  - systemctl enable --now nginx
  - systemctl restart nginx
  - systemctl status nginx
